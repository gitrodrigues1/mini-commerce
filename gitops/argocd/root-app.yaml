apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minicommerce
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gitrodrigues1/mini-commerce.git
    targetRevision: main
    path: gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
